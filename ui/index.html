<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HiFox 工作台 · 本地复现</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#111823; --panel2:#151d29; --line:#1e2733; --line2:#26313f;
    --text:#e6edf3; --muted:#8b98a9; --dim:#5f6b7a;
    --accent:#2f81f7; --green:#2ea043; --amber:#d29922; --red:#f85149; --purple:#a371f7;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:13px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
    overflow:hidden;
  }
  .app{display:grid;grid-template-columns:236px 1fr 452px;height:100vh}

  /* ---------- 左：导航 ---------- */
  .nav{border-right:1px solid var(--line);background:#0a0e13;display:flex;flex-direction:column;min-height:0}
  .brand{display:flex;align-items:center;gap:9px;padding:14px 14px 10px}
  .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#2f81f7,#a371f7);
    display:grid;place-items:center;font-weight:700;font-size:11px;color:#fff}
  .brand b{font-size:14px;letter-spacing:.2px}
  .brand span{color:var(--dim);font-size:11px;margin-left:4px}
  .space{display:flex;align-items:center;gap:8px;margin:4px 10px 8px;padding:7px 9px;
    border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:12px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green)}
  .navlist{padding:2px 8px}
  .nitem{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;color:var(--muted);font-size:12.5px}
  .nitem.active{background:#16202d;color:var(--text)}
  .nitem .ic{width:14px;text-align:center;opacity:.85}
  .sep{height:1px;background:var(--line);margin:8px 12px}
  .gtitle{padding:4px 16px;color:var(--dim);font-size:11px;letter-spacing:.6px}
  .tasks{padding:4px 8px;overflow:auto;flex:1;min-height:0}
  .task{padding:9px 10px;border-radius:8px;border:1px solid transparent;cursor:default}
  .task.active{background:#16202d;border-color:var(--line2)}
  .task .k{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .task .t{font-size:12.5px;margin:3px 0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navfoot{border-top:1px solid var(--line);padding:9px 14px;color:var(--dim);font-size:11px}

  /* ---------- 中：详情 ---------- */
  .detail{display:flex;flex-direction:column;min-height:0;min-width:0}
  .dhead{padding:16px 22px 10px;border-bottom:1px solid var(--line)}
  .kline{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
  h1{font-size:18px;line-height:1.45;margin:6px 0 10px;font-weight:600}
  .props{display:flex;flex-wrap:wrap;gap:18px;font-size:12px;color:var(--muted)}
  .props div span{color:var(--text)}
  .tabs{display:flex;gap:4px;padding:8px 18px 0;border-bottom:1px solid var(--line)}
  .tab{padding:7px 11px;font-size:12.5px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
  .tab.on{color:var(--text);border-color:var(--accent)}
  .dbody{overflow:auto;padding:16px 22px 40px;flex:1;min-height:0}
  .card{border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:14px}
  .card > h3{margin:0;padding:10px 13px;font-size:12px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
  .card .in{padding:12px 13px}
  .field{margin-bottom:12px}
  .field:last-child{margin-bottom:0}
  .field .fl{font-size:11px;color:var(--dim);margin-bottom:4px}
  .field .fv{font-size:12.5px;white-space:pre-wrap;color:#cdd9e5}
  .field .fv.agent{border-left:2px solid var(--purple);padding-left:9px}
  .arts{display:flex;flex-direction:column;gap:1px}
  .art{display:flex;align-items:center;gap:9px;padding:7px 4px;border-bottom:1px dashed #1b2430;font-size:12px;cursor:pointer}
  .art:last-child{border-bottom:none}
  .art:hover{background:#131b26}
  .art .p{font-family:var(--mono);font-size:11.5px;color:#9fb3c8;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .art .ok{color:var(--green)} .art .no{color:var(--dim)}
  .steps{display:flex;flex-direction:column;gap:6px}
  .step{display:flex;align-items:center;gap:9px;font-size:12px;font-family:var(--mono)}
  .step .n{width:16px;color:var(--dim)}
  .step .s{margin-left:auto;font-size:11px}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid}
  .b-green{color:#57d38c;border-color:#1c4b30;background:#0d2118}
  .b-amber{color:#e3b341;border-color:#4a3a10;background:#241d08}
  .b-blue{color:#79b8ff;border-color:#1f3f6d;background:#0f1f31}
  .b-red{color:#ff7b72;border-color:#5c1f1b;background:#2b1210}
  .b-gray{color:var(--muted);border-color:var(--line2);background:#131a23}
  .hist{position:relative;padding-left:14px}
  .hist:before{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:1px;background:var(--line2)}
  .hitem{position:relative;padding:0 0 12px 8px;font-size:12px}
  .hitem:before{content:"";position:absolute;left:-15px;top:6px;width:7px;height:7px;border-radius:50%;
    background:var(--panel);border:1px solid var(--line2)}
  .hitem.done:before{background:var(--green);border-color:var(--green)}
  .hitem .hm{color:var(--dim);font-size:11px;font-family:var(--mono)}

  /* ---------- 右：会话 ---------- */
  .chat{display:flex;flex-direction:column;border-left:1px solid var(--line);background:#0a0e13;min-height:0}
  .chead{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .avatar{width:26px;height:26px;border-radius:8px;background:#1b2735;display:grid;place-items:center;font-size:12px}
  .chead .nm{font-size:13px;font-weight:600}
  .chead .md{font-family:var(--mono);font-size:10.5px;color:var(--dim)}
  .chead .el{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .msgs{flex:1;overflow:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:12px;min-height:0}
  .msg{max-width:100%}
  .who{font-size:10.5px;color:var(--dim);margin-bottom:4px;font-family:var(--mono)}
  .bubble{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 11px;font-size:12.5px;
    white-space:pre-wrap;word-break:break-word;color:#d5e0ec}
  .msg.human .bubble{background:#132234;border-color:#1f3a5b}
  .msg.human .who{text-align:right}
  .msg.human .bubble{display:block}
  .msg.sys .bubble{border-style:dashed;background:transparent;color:var(--muted);font-size:12px}
  .footer{margin-top:8px;border-radius:8px;border:1px solid #1c2b3d;background:#0d1520;padding:8px 9px;
    font-family:var(--mono);font-size:11px;color:#8fa6bd;line-height:1.75}
  .footer .row{display:flex;gap:6px}
  .footer .k{color:#5d7691;min-width:58px}
  .footer .v{color:#b9cbdd}
  .footer .tg{color:#79b8ff}
  .composer{border-top:1px solid var(--line);padding:9px 12px 12px;background:#0a0e13}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .chip{padding:3px 9px;border-radius:999px;border:1px solid var(--line2);background:#111a24;color:var(--muted);
    font-size:11px;cursor:pointer;user-select:none}
  .chip:hover{border-color:var(--accent);color:#cfe3ff}
  textarea{width:100%;min-height:56px;max-height:120px;resize:none;background:#0f1620;color:var(--text);
    border:1px solid var(--line2);border-radius:9px;padding:9px 10px;font:inherit;outline:none}
  textarea:focus{border-color:#2f5f9e}
  .crow{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:11px;color:var(--dim);font-family:var(--mono)}
  button{border:none;border-radius:7px;padding:6px 14px;font-size:12px;cursor:pointer;background:var(--accent);color:#fff}
  button.ghost{background:#16202d;color:var(--muted);border:1px solid var(--line2)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .crow .sp{margin-left:auto}
  .empty{color:var(--dim);font-size:12px;text-align:center;padding:22px 0}
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-thumb{background:#1d2836;border-radius:4px}
  ::-webkit-scrollbar-thumb:hover{background:#26384a}
</style>
</head>
<body>
<div class="app">
  <aside class="nav">
    <div class="brand"><div class="logo">HF</div><b>HiFox</b><span>repro</span></div>
    <div class="space"><span class="dot"></span><span id="spaceName">产品空间</span></div>
    <div class="navlist">
      <div class="nitem active"><span class="ic">◪</span>任务</div>
      <div class="nitem"><span class="ic">▤</span>看板</div>
      <div class="nitem"><span class="ic">✉</span>收件箱</div>
      <div class="nitem"><span class="ic">◉</span>Agent</div>
      <div class="nitem"><span class="ic">⇄</span>Workflow</div>
    </div>
    <div class="sep"></div>
    <div class="gtitle">任务</div>
    <div class="tasks" id="taskList"></div>
    <div class="navfoot">本地复现 · 引擎独占账本</div>
  </aside>

  <main class="detail">
    <div class="dhead">
      <div class="kline"><span id="taskKey">—</span><span id="chips"></span></div>
      <h1 id="title">加载中…</h1>
      <div class="props" id="props"></div>
    </div>
    <div class="tabs">
      <div class="tab on" data-tab="doc">档案</div>
      <div class="tab" data-tab="ship">提测包</div>
      <div class="tab" data-tab="hist">活动</div>
    </div>
    <div class="dbody" id="dbody"></div>
  </main>

  <section class="chat">
    <div class="chead">
      <div class="avatar">狄</div>
      <div>
        <div class="nm" id="agentName">狄仁杰</div>
        <div class="md" id="modelName">hifox/GLM-5.3 · Max</div>
      </div>
      <div class="el" id="elapsed"></div>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="composer">
      <div class="chips" id="chipsRow"></div>
      <textarea id="input" placeholder="回复令牌或意见…"></textarea>
      <div class="crow">
        <span id="gateHint">—</span>
        <span class="sp"></span>
        <button class="ghost" id="btnResume" style="display:none">恢复运行</button>
        <button id="btnSend">发送</button>
      </div>
    </div>
  </section>
</div>

<script>
const FOOTER_KEYS = ['任务ID','轨道','阶段','等待','文案','状态','期望令牌','评审迭代','待此决策','待批决策','技能加载','阶段产物'];
let tab = 'doc';
let lastCount = 0;

function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function chipClass(status){
  if(status==='已完成') return 'b-green';
  if(status==='等待确认') return 'b-amber';
  if(status==='进行中') return 'b-blue';
  return 'b-gray';
}

function parseFooter(text){
  const m = String(text||'').match(/---页脚开始---([\s\S]*?)---页脚结束---/);
  if(!m) return null;
  const body = m[1].trim();
  const re = new RegExp('\\s(?=(?:'+FOOTER_KEYS.join('|')+'): )','g');
  const out = {};
  for(const seg of body.split(re)){
    const i = seg.indexOf(': ');
    if(i<0) continue;
    out[seg.slice(0,i)] = seg.slice(i+2).trim();
  }
  return out;
}

function renderFooter(f){
  const kv = parseFooter(f);
  if(!kv) return '';
  const rows = Object.entries(kv).map(([k,v])=>{
    const isToken = v.startsWith('【');
    return `<div class="row"><span class="k">${esc(k)}</span><span class="v${isToken?' tg':''}">${esc(v)}</span></div>`;
  }).join('');
  return `<div class="footer">${rows}</div>`;
}

async function send(text){
  if(!text.trim()) return;
  await fetch('/api/message',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({text})});
  document.getElementById('input').value='';
  refresh();
}

async function refresh(){
  let s;
  try{ s = await (await fetch('/api/state')).json(); }catch(e){ return; }
  if(!s.ok){ document.getElementById('title').textContent = s.error || '无数据'; return; }

  const L = s.ledger, T = s.task;
  document.getElementById('spaceName').textContent = T.space || '产品空间';
  document.getElementById('taskKey').textContent = T.key;
  document.getElementById('title').textContent = T.title;
  document.getElementById('agentName').textContent = s.config.agent;
  document.getElementById('modelName').textContent = s.config.model;

  document.getElementById('chips').innerHTML =
    `<span class="badge ${chipClass(L.status)}">${esc(L.status)}</span>
     <span class="badge b-gray">${esc(L.stage_label)}</span>
     ${L.waiting?`<span class="badge b-amber">等待 ${esc(L.waiting)}</span>`:''}`;

  document.getElementById('props').innerHTML = [
    ['状态', T.status],['优先级', T.priority],['类型', T.type],
    ['处理人', s.config.agent],['评审迭代', L.review_iteration + ' / ' + s.config.maxLoop],['基线', L.baseline_branch],
  ].map(([k,v])=>`<div>${k} <span>${esc(v)}</span></div>`).join('');

  const elapsed = L.finished_at ? new Date(L.finished_at)-new Date(L.started_at) : Date.now()-new Date(L.started_at);
  const mins = Math.floor(elapsed/60000), secs = Math.floor(elapsed/1000)%60;
  document.getElementById('elapsed').textContent = `${L.status==='已完成'?'已完成':'已运行'} ${mins} 分 ${secs} 秒`;

  const others = (s.tasks||[]).filter(x=>x.key!==T.key);
  document.getElementById('taskList').innerHTML = `
    <div class="task active">
      <div class="k">${esc(T.key)}</div>
      <div class="t">${esc(T.title)}</div>
      <span class="badge ${chipClass(L.status)}">${esc(L.stage_label)}</span>
    </div>
    ${others.length?`<div class="navfoot" style="margin:10px 0 4px">其他任务（${others.length}）</div>`:''}
    ${others.map(o=>`
      <div class="task" title="用 node src/main.ts list 查看全部；切任务需重启 dev --ws">
        <div class="k">${esc(o.key)}</div>
        <div class="t">${esc(o.title)}</div>
        <span class="badge ${o.needs_human?'b-amber':'b-gray'}">${esc(o.stage_label)}${o.needs_human?' · 等人':''}</span>
      </div>`).join('')}`;

  renderDetail(s);
  renderChat(s);
  renderComposer(s);
}

function renderDetail(s){
  const L = s.ledger, T = s.task;
  const box = document.getElementById('dbody');
  if(tab==='doc'){
    const fields = Object.entries(T.custom_fields||{}).map(([k,v])=>
      `<div class="field"><div class="fl">${esc(k)}</div>
       <div class="fv ${String(v).includes('### Agent 记录')?'agent':''}">${esc(v)}</div></div>`).join('') || '<div class="empty">无自定义字段</div>';

    box.innerHTML = `
      <div class="card"><h3>描述（人写，Agent 不改）</h3><div class="in">
        <div class="field"><div class="fv">${esc(T.description)}</div></div></div></div>

      <div class="card"><h3>自定义字段</h3><div class="in">${fields}</div></div>

      <div class="card"><h3>阶段产物（${L.artifacts.length}）</h3><div class="in"><div class="arts">
        ${s.artifacts.map(a=>`<div class="art" onclick="openArt('${esc(a.path)}')">
            <span class="${a.exists?'ok':'no'}">${a.exists?'●':'○'}</span>
            <span class="p">${esc(a.path.replace('.xwing-task/lattice/',''))}</span>
            <span class="badge b-gray">${a.owner==='engine'?'引擎':'Runtime'}</span>
            <span class="badge b-gray">${esc(a.stage)}</span>
          </div>`).join('')}
      </div></div></div>`;
  }

  if(tab==='ship'){
    const steps = (L.ship_steps||[]).map(x=>{
      const c = x.status==='ok'?'b-green':x.status==='failed'?'b-red':'b-gray';
      return `<div class="step"><span class="n">${x.seq}</span><span>${esc(x.name)}</span>
        <span class="s badge ${c}">${esc(x.status)}</span></div>`;
    }).join('') || '<div class="empty">尚未提测</div>';
    box.innerHTML = `
      <div class="card"><h3>提测七步（幂等键已登记）</h3><div class="in"><div class="steps">${steps}</div></div></div>
      <div class="card"><h3>任务状态</h3><div class="in">
        <div class="field"><div class="fl">当前</div><div class="fv">${esc(T.status)}</div></div>
        <div class="field"><div class="fl">环境</div><div class="fv">${T.env && T.env.running?'运行中':'已停'}</div></div>
        <div class="field"><div class="fl">页脚</div><div class="fv">${esc(s.footer)}</div></div>
      </div></div>`;
  }

  if(tab==='hist'){
    const EV = {
      stage_enter:'进入阶段', stage_exit:'离开阶段', stage_error:'阶段异常', stage_timeout:'阶段超时',
      gate_wait:'等待令牌', gate_reject:'拒绝放行', gate_accept:'收到令牌', gate_refine:'方案精化',
      rework:'返工', review_mismatch:'评审核对不一致', pause:'暂停', resume:'恢复',
      ship_step:'提测步骤', context_trim:'上下文压缩', footer_forgery:'页脚伪造',
      ledger_error:'账本错误', lock_denied:'锁竞争'
    };
    const events = (s.events||[]).map(e=>{
      const bad = /error|timeout|mismatch|forge|denied/.test(e.kind);
      return `<div class="hitem ${bad?'':'done'}">
        <div><b>${esc(EV[e.kind]||e.kind)}</b>${e.stage?' · '+esc(e.stage):''} · ${esc(e.reason||'')}</div>
        <div class="hm">${esc(e.at)}${e.actor?' · '+esc(e.actor):''}</div>
      </div>`;
    }).join('') || '<div class="empty">还没有事件</div>';

    const items = (s.ledger.history||[]).slice().reverse().map(h=>`
      <div class="hitem done">
        <div>${esc(h.from||'∅')} → <b>${esc(h.to)}</b> · ${esc(h.reason)}</div>
        <div class="hm">${esc(h.at)}</div>
      </div>`).join('') || '<div class="empty">无迁移记录</div>';

    box.innerHTML = `
      <div class="card"><h3>事件流（引擎与人的动作，只追加）</h3><div class="in"><div class="hist">${events}</div></div></div>
      <div class="card"><h3>状态迁移（账本 history，不可手改）</h3><div class="in"><div class="hist">${items}</div></div></div>`;
  }
}

function renderChat(s){
  const box = document.getElementById('msgs');
  const msgs = s.messages;
  box.innerHTML = msgs.map(m=>{
    const isHuman = m.role==='human';
    const body = m.body || m.text;
    const footer = m.footer ? renderFooter(m.footer) : '';
    return `<div class="msg ${isHuman?'human':'agent'}">
      <div class="who">${isHuman?'你':'狄仁杰'} · ${new Date(m.at).toLocaleTimeString('zh-CN',{hour12:false})}</div>
      <div class="bubble">${esc(body)}${footer}</div>
    </div>`;
  }).join('') || '<div class="empty">等待 Agent 开始…</div>';

  if(msgs.length !== lastCount){ box.scrollTop = box.scrollHeight; lastCount = msgs.length; }
}

function renderComposer(s){
  const L = s.ledger;
  const chips = document.getElementById('chipsRow');
  const hint = document.getElementById('gateHint');
  const resume = document.getElementById('btnResume');

  if(L.stage==='WAIT_DEV'){
    chips.innerHTML = `<span class="chip" onclick="fill('1A 2A 3A【进入开发】')">1A 2A 3A【进入开发】</span>
      <span class="chip" onclick="fill('【进入开发】')">【进入开发】</span>
      <span class="chip" onclick="fill('继续')">继续（试验证）</span>`;
    hint.textContent = '等待令牌：' + s.tokens.dev;
  } else if(L.stage==='WAIT_SHIP'){
    chips.innerHTML = `<span class="chip" onclick="fill('【提测】')">【提测】</span>
      <span class="chip" onclick="fill('请把边界夹取写得更清楚一些')">发返工意见</span>`;
    hint.textContent = '等待令牌：' + s.tokens.ship;
  } else if(L.stage==='PAUSED'){
    chips.innerHTML = '';
    hint.textContent = '已暂停：' + (L.pause_reason||'') + '（聊天令牌无效）';
  } else if(L.stage==='PARTIAL_SHIP'){
    chips.innerHTML = '';
    hint.textContent = '提测部分完成，可继续';
  } else if(L.stage==='DONE'){
    chips.innerHTML = '';
    hint.textContent = '已完成，任务转「待测试」';
  } else {
    chips.innerHTML = '';
    hint.textContent = '自动阶段进行中…';
  }

  resume.style.display = (L.stage==='PAUSED') ? 'inline-block' : 'none';
  resume.textContent = '操作员恢复';
  resume.onclick = async ()=>{
    await fetch('/api/resume',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({reason:'面板上人工确认'})});
    setTimeout(refresh,600);
  };
}

function fill(t){ document.getElementById('input').value = t; document.getElementById('input').focus(); }
async function openArt(p){
  const r = await fetch('/api/artifact?path='+encodeURIComponent(p));
  if(!r.ok){ alert('产物不存在'); return; }
  const text = await r.text();
  const w = window.open('','_blank');
  w.document.write('<pre style="white-space:pre-wrap;font:13px/1.7 ui-monospace,Consolas,monospace;padding:24px;max-width:900px;margin:auto">'
    + text.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</pre>');
  w.document.title = p;
}

document.getElementById('btnSend').onclick = ()=>send(document.getElementById('input').value);
document.getElementById('input').addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter') send(e.target.value);
});
document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  el.classList.add('on'); tab = el.dataset.tab; refresh();
});

refresh();
setInterval(refresh, 1200);
</script>
</body>
</html>
